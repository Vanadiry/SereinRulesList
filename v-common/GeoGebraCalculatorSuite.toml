[info]
app_id = "GeoGebraCalculatorSuite"
name = "GeoGebra Calculator Suite"
description = "科学和图形计算器套件"
official_website = "https://www.videolan.org/vlc/"
platforms = ["macos", "windows"]

[config]
type = "html_selector"
v_type = "direct"
v_url = "Latest"
url = "https://geogebra.github.io/docs/reference/en/GeoGebra_Installation/"

[config.macos]
d_position = { selector = "a[href$='mac-suite-portable']", attr = "href" }

[config.windows]
d_position = { selector = "a[href$='win-suite']", attr = "href" }
