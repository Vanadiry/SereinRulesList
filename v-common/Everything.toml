[info]
app_id = "Everything"
name = "Everything"
description = "本地文件搜索工具"
official_website = "https://www.voidtools.com/zh-cn/downloads/"
platforms = ["windows"]

[config]
type = "html_selector"
url = "https://www.voidtools.com/zh-cn/downloads/"
baseurl = "https://www.voidtools.com"

[config.windows]
v_position = { selector = "h2#dl", regex = "下载 Everything (\\d+\\.\\d+\\.\\d+\\.\\d+)" }
d_position = { selector = "a.button[href*='x64-Setup']", attr = "href" }
