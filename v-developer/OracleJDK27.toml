[info]
app_id = "OracleJDK27"
name = "Oracle JDK 27"
description = "Oracle Java SE Development Kit 27"
official_website = "https://www.oracle.com/java/technologies/downloads/#java27"
platforms = ["macos", "windows", "linux"]

[config]
type = "html_selector"
url = "https://www.oracle.com/java/technologies/downloads/"
v_position = { selector = "#java27 h3", regex = "Java SE Development Kit ([0-9.]+)" }

[config.macos]
d_position = { selector = "a[href$='jdk-27_macos-aarch64_bin.dmg']", attr = "href" }

[config.windows]
d_position = { selector = "a[href$='jdk-27_windows-x64_bin.exe']", attr = "href" }

[config.linux]
d_position = { selector = "a[href$='jdk-27_linux-x64_bin.tar.gz']", attr = "href" }
