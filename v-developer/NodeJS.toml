[info]
app_id = "NodeJS"
name = "Node.js"
description = "JavaScript 运行时"
official_website = "https://nodejs.org/zh-cn/download"
platforms = ["macos", "windows", "linux"]

[config]
type = "json"
url = "https://nodejs.org/dist/index.json"
v_position = ['version~^v\d+\.\d+\.\d+$', "version"]

[config.macos]
d_type = "direct"
d_url = "https://nodejs.org/dist/v{version}/node-v{version}.pkg"

[config.windows]
d_type = "direct"
d_url = "https://nodejs.org/dist/v{version}/node-v{version}-x64.msi"

[config.linux]
d_type = "direct"
d_url = "https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz"
