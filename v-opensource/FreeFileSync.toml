[info]
app_id = "FreeFileSync"
name = "FreeFileSync"
description = "数据同步工具"
official_website = "https://freefilesync.org/download.php"
platforms = ["windows", "macos", "linux"]

[config]
type = "regex"
url = "https://freefilesync.org/download.php"
baseurl = "https://freefilesync.org"
v_position = "FreeFileSync_([0-9]+(?:[.][0-9]+)*)"

[config.windows]
d_type = "regex"
d_position = "<a href=\"(/download/FreeFileSync_[0-9][0-9.]*_Windows_Setup\\.exe)\""

[config.macos]
d_type = "regex"
d_position = "<a href=\"(/download/FreeFileSync_[0-9][0-9.]*_macOS\\.zip)\""

[config.linux]
d_type = "regex"
d_position = "<a href=\"(/download/FreeFileSync_[0-9][0-9.]*_Linux_x86_64\\.tar\\.gz)\""
