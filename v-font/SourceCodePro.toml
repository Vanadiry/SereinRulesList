[info]
app_id = "SourceCodePro"
name = "Source Code Pro"
description = "等宽编程字体"
official_website = "https://github.com/adobe-fonts/source-code-pro/releases"
platforms = ["font"]

[config]
type = "regex"
url = "https://api.github.com/repos/adobe-fonts/source-code-pro/releases?per_page=1"

[config.font]
v_position = '"tag_name": "[^"]*?/(\d+(?:\.\d+)*R)[^"/]*"'
d_position = '"browser_download_url": "(https://github\.com/adobe-fonts/source-code-pro/releases/download/[^"]*/VF-source-code-VF-[^"]*\.zip)"'
